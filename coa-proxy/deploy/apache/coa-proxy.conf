# FreeRADIUS CoA Proxy API - Apache 2.4 Configuration
# Target OS: Ubuntu 24.04 LTS / PHP 8.3

<VirtualHost *:80>
    ServerName coa.example.com
    ServerAdmin admin@example.com
    DocumentRoot /var/www/coa-proxy/public

    # Set LimitRequestBody to 64 KB (65536 bytes)
    LimitRequestBody 65536

    <Directory /var/www/coa-proxy/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # Rewrite Rules for Single Entry Point
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule ^ index.php [L]
        </IfModule>
    </Directory>

    # Strictly Deny Access to Non-Public Directories & Files
    <Directory ~ "^/var/www/coa-proxy/(config|src|storage|deploy|tests|vendor)">
        Require all denied
    </Directory>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    <FilesMatch "\.(env|example|json|log|sh|md|lock)$">
        Require all denied
    </FilesMatch>

    # Security Headers
    <IfModule mod_headers.c>
        Header set X-Content-Type-Options "nosniff"
        Header set X-Frame-Options "DENY"
        Header set Referrer-Policy "no-referrer"
        Header set Content-Security-Policy "default-src 'none'"
    </IfModule>

    # PHP-FPM Proxy via Unix Socket
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost/"
    </FilesMatch>

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/coa-proxy_error.log
    CustomLog ${APACHE_LOG_DIR}/coa-proxy_access.log combined
</VirtualHost>
