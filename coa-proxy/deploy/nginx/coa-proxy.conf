# FreeRADIUS CoA Proxy API - Nginx Configuration
# Target OS: Ubuntu 24.04 LTS / PHP 8.3-FPM

limit_req_zone $binary_remote_addr zone=coa_api_limit:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name coa.example.com;

    # Document Root points strictly to public directory
    root /var/www/coa-proxy/public;
    index index.php;

    # Limit request body size to 64 KB to mitigate DoS payload attacks
    client_max_body_size 64k;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'none'" always;

    # Apply Rate Limiting
    limit_req zone=coa_api_limit burst=10 nodelay;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        include fastcgi_params;
    }

    # Block access to hidden dotfiles (.env, .git, etc)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block access to sensitive project directories
    location ~ ^/(config|src|storage|deploy|tests|vendor)/ {
        deny all;
        return 404;
    }

    # Logging
    access_log /var/log/nginx/coa-proxy.access.log;
    error_log /var/log/nginx/coa-proxy.error.log warn;
}
